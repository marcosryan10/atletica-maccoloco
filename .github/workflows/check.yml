name: Verificar sistema
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:auth
      - run: npm run test:password-auth
      - run: npm run test:payments
      - run: npm run test:pix
      - run: npm run test:pix-flow
      - run: npm run build
